# LLM provider/model configuration (Issue #4).
#
# Source of truth for which providers exist and what model/base_url/api_style/
# reasoning each uses. Switch provider or model by editing this file (or pointing
# OMEGACLAW_LLM_CONFIG_PATH at another file) -- no Python edit required. The active
# provider is chosen by the MeTTa `provider` config (src/loop.metta); the model is
# taken from this file and surfaced in the startup log.
#
# A relative OMEGACLAW_LLM_CONFIG_PATH resolves against the install root. A missing
# or invalid file falls back to the built-in defaults in src/provider_config.py
# (which mirror this file) with a warning -- provider selection never bricks.
#
# api_style: chat_completions | responses | asione
# The Test provider is registered in code (environment-driven), not here.
version: 1
default_provider: Anthropic

providers:
  ASICloud:
    api_key_env: ASI_API_KEY
    model: minimax/minimax-m3
    base_url: https://inference.asicloud.cudos.org/v1
    api_style: chat_completions

  SNET:
    api_key_env: SNET_API_KEY
    model: openai/gpt-oss-120b
    base_url: https://llm.c.singularitynet.io/v1
    api_style: chat_completions
    # Available models (GET /v1/models): openai/gpt-oss-120b, qwen/qwen3.5-35b-a3b, asi1,
    # nousresearch/hermes-4-70b, minimax/minimax-m2.5|m2.7|m3-f, z-ai/*. Change `model` to switch.

  Anthropic:
    api_key_env: ANTHROPIC_API_KEY
    model: claude-opus-4-8
    base_url: https://api.anthropic.com/v1/
    api_style: chat_completions

  Ollama-local:
    api_key_env: OLLAMA_API_KEY
    model: qwen3.5:9b
    base_url: http://localhost:11434/v1
    api_style: chat_completions

  ASIOne:
    api_key_env: ASIONE_API_KEY
    model: asi1-ultra
    base_url: https://api.asi1.ai/v1
    api_style: asione

  OpenRouter:
    api_key_env: OPENROUTER_API_KEY
    model: z-ai/glm-5.2
    base_url: https://openrouter.ai/api/v1
    api_style: chat_completions
    reasoning:
      enabled: true
      max_tokens: 6000
      exclude: true

  MiniMaxM3:
    api_key_env: OPENROUTER_API_KEY
    model: minimax/minimax-m3
    base_url: https://openrouter.ai/api/v1
    api_style: chat_completions
    reasoning:
      enabled: true
      max_tokens: 6000
      exclude: true

  OpenAI:
    api_key_env: OPENAI_API_KEY
    model: gpt-5.5
    base_url: https://api.openai.com/v1
    api_style: responses
