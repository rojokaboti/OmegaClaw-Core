# Per-instance override for running multiple isolated freeciv-llm stacks in parallel.
# Usage: INST=<n> PROXY_PORT=<port> docker compose -p fciv<n> -f docker-compose.yml \
#          -f compose.batch-override.yml up -d fciv-net
# Overrides the fixed container_names (else they collide across instances) and remaps the proxy
# host port, dropping the unused :8003 llm-gateway mapping (`!override` replaces the base list).
services:
  fciv-net:
    container_name: fciv-net-${INST}
    ports: !override
      - "${PROXY_PORT}:8002"
  db:
    container_name: fciv-db-${INST}
  redis:
    container_name: fciv-redis-${INST}
  flyway:
    container_name: fciv-flyway-${INST}
  truncate_servers_table:
    container_name: fciv-truncate-servers-${INST}
